# Exceptions for gitleaks: values that look like secrets and are not.
#
# Every entry names one file and why what is in it is safe. A blanket
# "skip tests/" is deliberately not used: test files are exactly where a real
# site address or key gets pasted by accident while writing a fixture.

[extend]
useDefault = true

[[allowlists]]
description = """Published test vectors. tests/fixtures/substrate_vectors.json \
holds mnemonics, mini secrets and addresses of throwaway accounts, recorded \
from the substrate-interface stack so the integration's own crypto can be \
checked against it byte for byte. The accounts hold nothing and never will; \
reports must keep opening with both stacks, so these vectors stay."""
paths = ['''tests/fixtures/substrate_vectors\.json''']
